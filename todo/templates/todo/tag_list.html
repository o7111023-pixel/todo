{% extends "todo/base.html" %}

{% block content %}

<h1>Tags</h1>

<a href="#">Add Tag</a>

<table border="1" cellpadding="5">
    <tr>
        <th>Name</th>
        <th>Actions</th>
    </tr>

    {% for tag in tags %}
    <tr>
        <td>{{ tag.name }}</td>
        <td>
            <a href="#">Update</a>
            <a href="#">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
