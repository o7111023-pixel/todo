{% extends "todo/base.html" %}

{% block content %}

<h1>Tags</h1>

<a href="{% url 'todo:tag-create' %}">Add Tag</a>

<table border="1">
<tr>
    <th>Name</th>
    <th>Actions</th>
</tr>

{% for tag in tags %}
<tr>
    <td>{{ tag.name }}</td>
    <td>
        <a href="{% url 'todo:tag-update' tag.id %}">Update</a>
        <a href="{% url 'todo:tag-delete' tag.id %}">Delete</a>
    </td>
</tr>
{% endfor %}
</table>

{% endblock %}
