<!DOCTYPE html>
<html>
<head>
    <title>Todo App</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 220px;
            background: #1f2937;
            color: white;
            padding: 20px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            margin: 10px 0;
            padding: 8px;
            border-radius: 6px;
        }

        .sidebar a:hover {
            background: #374151;
        }

        /* MAIN */
        .main {
            flex: 1;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .btn {
            display: inline-block;
            padding: 6px 10px;
            margin: 3px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
        }

        .btn-add {
            background: #16a34a;
            color: white;
        }

        .btn-edit {
            background: #2563eb;
            color: white;
        }

        .btn-delete {
            background: #dc2626;
            color: white;
        }

        .btn-toggle {
            background: #f59e0b;
            color: white;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
        }

        table th, table td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2>Todo App</h2>

        <a href="{% url 'todo:task-list' %}">🏠 Home</a>
        <a href="{% url 'todo:tag-list' %}">🏷 Tags</a>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main">
        {% block content %}{% endblock %}
    </div>

</div>

</body>
</html>
